<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-label="강제 퇴장과 방 삭제"><title>강제 퇴장과 방 삭제</title><desc>Master가 대상 방 선택 → Master 세션 유효? → 방 전체 삭제인가? → 방 비활성화 · 목록 제거 전체 참가자를 정리 대상으로 → 대상 토큰 폐기 · 명령 취소 removed 알림 · 연결 종료 → PeerConnection과 트랙 정리 빈 방 닫기 · 감사 기록 → 저장된 회의록 DB 유지</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">강제 퇴장과 방 삭제</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="106">Master가 대상 방 선택</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,188.0 L410.0,232 L260,276.0 L110.0,232 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="238">Master 세션 유효?</tspan></text><path d="M260,276 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="308" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,232 L550,232" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="220" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="194.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="225">요청 거부</tspan><tspan x="720" y="251">재인증 필요</tspan></text><path d="M260,320.0 L410.0,364 L260,408.0 L110.0,364 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fi