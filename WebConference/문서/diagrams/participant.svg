<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 828" role="img" aria-label="참석자 빠른 시작"><title>참석자 빠른 시작</title><desc>초대 링크 열기 → 이름 · 장치 설정 회의 참여하기 → 스피커 켜기 상대방 소리 확인 → 회의 모드인가? → 손들기 → 방장의 발표 지정 마이크를 켜고 발언 → 필요한 회의록 저장 나가기</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">참석자 빠른 시작</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="106">초대 링크 열기</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="194.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="225">이름 · 장치 설정</tspan><tspan x="260" y="251">회의 참여하기</tspan></text><path d="M260,270 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="326.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="357">스피커 켜기</tspan><tspan x="260" y="383">상대방 소리 확인</tspan></text><path d="M260,402 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,452.0 L410.0,496 L260,540.0 L110.0,496 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="502">회의 모드인가?</tspan></text><path d="M260,540 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="572" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,496 L550,496" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="484" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">FREE Talk</text><rect x="550.0" y="458.0" width="340" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="489">마이크를 켜고 대화</tspan><tspan x="720" y="515">공유는 발표자만 가능</tspan></text><rect x="110.0" y="590.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="621">손들기 → 방장의 발표 지정</tspan><tspan x="260" y="647">마이크를 켜고 발언</tspan></text><path d="M260,666 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="722.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">필요한 회의록 저장</tspan><tspan x="260" y="779">나가기</tspan></text><path d="M890,496 L922,496 L922,760 L410,760" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/></g></svg>