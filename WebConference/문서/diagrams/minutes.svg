<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-label="자동 기록에서 파일 저장까지"><title>자동 기록에서 파일 저장까지</title><desc>회의 모드에서 자동 기록 켜기 → 발표권과 마이크가 활성? → 음성 수집 → 인식 대기열 텍스트 완료 후 DB 저장 → 저장 준비: 자동 기록 끄기 → Whisper 대기 0건? → Word · PDF · TXT 선택 원하면 요약 추가 체크 → 전체 저장 기록 내려받기 파일 확인 후 나가기</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">자동 기록에서 파일 저장까지</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="106">회의 모드에서 자동 기록 켜기</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,188.0 L410.0,232 L260,276.0 L110.0,232 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="238">발표권과 마이크가 활성?</tspan></text><path d="M260,276 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="308" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,232 L550,232" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="220" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="194.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="225">해당 음성 기록 안 함</tspan><tspan x="720" y="251">권한과 장치 확인</tspan></text><rect x="110.0" y="326.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="357">음성 수집 → 인식 대기열</tspan><tspan x="260" y="383">텍스트 완료 후 DB 저장</tspan></text><path d="M260,402 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="458.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="502">저장 준비: 자동 기록 끄기</tspan></text><path d="M260,534 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,584.0 L410.0,628 L260,672.0 L110.0,628 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="634">Whisper 대기 0건?</tspan></text><path d="M260,672 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="704" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예 / Vosk 완료 확인</text><path d="M410,628 L550,628" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="616" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="590.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="621">완료까지 기다린 뒤 재확인</tspan><tspan x="720" y="647">처리 중 다운로드는 409</tspan></text><rect x="110.0" y="722.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">Word · PDF · TXT 선택</tspan><tspan x="260" y="779">원하면 요약 추가 체크</tspan></text><path d="M260,798 L260,854" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="854.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="885">전체 저