# Ubuntu/Linux host. Host networking lets WebRTC advertise the server interfaces.
services:
  meeting:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - meeting-data:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      meeting:
        condition: service_healthy
  turn:
    image: coturn/coturn:4.6.3
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
volumes:
  meeting-data:
  caddy-data:
  caddy-config:
