plugins { id 'com.android.application' }
android {
    namespace 'kr.co.batteryreport'
    compileSdk 35
    defaultConfig { applicationId 'kr.co.batteryreport'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        localRelease {
            if (System.getenv('BATTERY_REPORT_KEYSTORE')) {
                storeFile file(System.getenv('BATTERY_REPORT_KEYSTORE'))
                storePassword System.getenv('BATTERY_REPORT_STORE_PASSWORD')
                keyAlias 'battery-report'
                keyPassword System.getenv('BATTERY_REPORT_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.localRelease } }
}
