<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 828" role="img" aria-label="방 입장과 WebRTC 연결"><title>방 입장과 WebRTC 연결</title><desc>초대 ID와 이름으로 참여 또는 새 방 생성 → 방 존재 · 정원 확인 → 참여 토큰 발급 WebSocket 첫 메시지 인증 → welcome과 현재 상태 수신 송신 offer / answer 교환 → ICE 연결 성공? → 다른 참석자 미디어 구독 상태와 보드 동기화</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">방 입장과 WebRTC 연결</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="93">초대 ID와 이름으로 참여</tspan><tspan x="260" y="119">또는 새 방 생성</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,188.0 L410.0,232 L260,276.0 L110.0,232 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="238">방 존재 · 정원 확인</tspan></text><path d="M260,276 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="308" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">통과</text><path d="M410,232 L550,232" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="220" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">실패</text><rect x="550.0" y="194.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="225">ID 오류 404 / 정원 409</tspan><tspan x="720" y="251">최신 초대 정보 확인</tspan></text><rect x="110.0" y="326.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="357">참여 토큰 발급</tspan><tspan x="260" y="383">WebSocket 첫 메시지 인증</tspan></text><path d="M260,402 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="458.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="489">welcome과 현재 상태 수신</tspan><tspan x="260" y="515">송신 offer / answer 교환</tspan></text><path d="M260,534 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,584.0 L410.0,628 L260,672.0 L110.0,628 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="634">ICE 연결 성공?</tspan></text><path d="M260,672 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="704" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,628 L550,628" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="616" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">실패</text><rect x="550.0" y="590.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="621">UDP · NAT · TURN 점검</tspan><tspan x="720" y="647">나간 뒤 재입장</tspan></text><rect x="110.0" y="722.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">다른 참석자 미디어 구독</tspan><tspan x="260" y="779">상태와 보드 동기화</tspan></text></g></svg>