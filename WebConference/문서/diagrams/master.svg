<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 828" role="img" aria-label="Master 비밀번호 인증과 관리"><title>Master 비밀번호 인증과 관리</title><desc>Master 인증 버튼 키 입력 → 키 파일 · 시도 제한 정상? → 키 해시 일치? → 최대 1시간 관리 세션 발급 브라우저 메모리에 보관 → 요청 시 만료 · revision 유효? → 방 생성 · 조회 · 입장 강제 퇴장 · 방 삭제</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">Master 비밀번호 인증과 관리</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="93">Master 인증 버튼</tspan><tspan x="260" y="119">키 입력</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,188.0 L410.0,232 L260,276.0 L110.0,232 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="238">키 파일 · 시도 제한 정상?</tspan></text><path d="M260,276 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="308" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,232 L550,232" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="220" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="194.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="225">미설정 503 / 제한 429</tspan><tspan x="720" y="251">관리자 점검 또는 대기</tspan></text><path d="M260,320.0 L410.0,364 L260,408.0 L110.0,364 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="370">키 해시 일치?</tspan></text><path d="M260,408 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="440" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,364 L550,364" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="352" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="326.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="357">인증 실패 401</tspan><tspan x="720" y="383">다시 입력 또는 서버 키 변경</tspan></text><rect x="110.0" y="458.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="489">최대 1시간 관리 세션 발급</tspan><tspan x="260" y="515">브라우저 메모리에 보관</tspan></text><path d="M260,534 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,584.0 L410.0,628 L260,672.0 L110.0,628 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="634">요청 시 만료 · revision 유효?</tspan></text><path d="M260,672 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="704" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,628 L550,628" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="616" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="590.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="621">관리 요청 거부 401</tspan><tspan x="720" y="647">새 키로 재인증</tspan></text><rect x="110.0" y="722.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">방 생성 · 조회 · 입장</tspan><tspan x="260" y="779">강제 퇴장 · 방 삭제</tspan></text></g></svg>