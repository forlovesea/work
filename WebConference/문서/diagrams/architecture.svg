<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-label="전체 시스템 구성"><title>전체 시스템 구성</title><desc>브라우저는 HTTPS와 WebSocket으로 Nginx 및 FastAPI와 연결하고 별도 WebRTC 경로로 aiortc와 통신한다. 음성 인식 결과와 승인 정보는 SQLite에 저장한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="35">제어 요청과 미디어 전송 경로</tspan></text><rect x="290.0" y="62.0" width="380" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="480" y="106">PC 또는 스마트폰 브라우저</tspan></text><rect x="60.0" y="217.0" width="350" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="235" y="248">Nginx</tspan><tspan x="235" y="274">HTTPS 10443</tspan></text><rect x="550.0" y="217.0" width="350" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="725" y="248">aiortc 미디어 릴레이</tspan><tspan x="725" y="274">ICE 직접 연결 또는 TURN</tspan></text><rect x="60.0" y="397.0" width="350" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="235" y="428">FastAPI와 Hub</tspan><tspan x="235" y="454">HTTP · WebSocket · 권한</tspan></text><rect x="550.0" y="397.0" width="350" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="725" y="428">로컬 음성 인식</tspan><tspan x="725" y="454">Vosk 또는 Whisper</tspan></text><rect x="60.0" y="577.0" width="350" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="235" y="608">SQLite</tspan><tspan x="235" y="634">기록 · 승인 · 감사 이력</tspan></text><rect x="550.0" y="577.0" width="350" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="725" y="608">SMTP → Master 이메일</tspan><tspan x="725" y="634">일반 방장 승인 요청</tspan></text><path d="M420,138 L420,175 L235,175 L235,217" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="163" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">HTTPS / WSS</text><path d="M540,138 L540,175 L725,175 L725,217" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="163" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">WebRTC 미디어</text><path d="M235,293 L235,397" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="352" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">127.0.0.1:8000</text><path d="M725,293 L725,397" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="742" y="352" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">발언권 적용 음성</text><path d="M410,435 L480,435 L480,255 L550,255" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="493" y="327" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">미디어 제어</text><path d="M235,473 L235,577" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="542" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">기록 저장</text><path d="M550,435 L515,435 L515,520 L235,520" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="507" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">전사 결과</text><path d="M410,450 L455,450 L455,615 L550,615" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="467" y="590" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">메일 요청</text></g></svg>