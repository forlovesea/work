<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Child · 스마트폰 제어</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#18243c;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:32px 20px}.brand{color:#2563eb;font-weight:800;letter-spacing:.03em}.intro{color:#65718a;margin:6px 0 24px}h1{font-size:27px;margin:12px 0 0}h2{font-size:20px;margin:0 0 14px}.card{background:white;border:1px solid #e2e8f0;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #1e3a8a08}label{display:block;font-weight:650;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}input:focus{outline:3px solid #bfdbfe;border-color:#2563eb}button{border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#2563eb;color:white;width:100%;margin-top:16px}.secondary{background:#eaf1ff;color:#1d4ed8}.stop{width:100%;color:#b42318;background:#fff1f0;margin-top:12px}.quick{display:flex;gap:8px;margin:12px 0}.quick button{flex:1;padding:10px 4px}.note{font-size:13px;color:#64748b;margin:12px 0 0}#countdown{font-size:38px;line-height:1.2;font-weight:800;color:#2563eb;margin:12px 0;font-variant-numeric:tabular-nums}#message{white-space:pre-wrap;padding:14px;border-radius:12px;background:#fff7ed;color:#9a3412}#message:empty{display:none}[hidden]{display:none!important}button:disabled{opacity:.5;cursor:wait}.footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#64748b}.footer button{background:transparent;color:#475569;padding:8px}
.password-field{position:relative}.password-field input{padding-right:60px}.password-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:10px;background:transparent;color:#475569;display:grid;place-items:center}.password-eye{border-radius:50%;color:#7085a3;transition:background-color .18s ease,color .18s ease}.password-eye:hover{background:#eaf2ff;color:#3b6ebe}.password-eye:active{background:#dbeafe}.password-eye:focus-visible{outline:3px solid #bfdbfe}.password-eye svg{width:24px;height:24px}.password-eye .eye-closed{display:none}.password-eye[aria-pressed="true"] .eye-open{display:none}.password-eye[aria-pressed="true"] .eye-closed{display:block}
</style></head><body><main>
<div class="brand">SAFE CHILD</div><h1>PC 사이트 허용 시간</h1><p class="intro">같은 Wi-Fi에서 보호 설정을 관리하세요.</p>
<p id="message" role="status" aria-live="polite"></p>
<form id="login" class="card"><h2>관리자 인증</h2><label for="password">관리자 또는 마스터 비밀번호</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="button" id="password-eye" class="password-eye" aria-label="비밀번호 표시" aria-pressed="false" aria-controls="password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="eye-open"><path d="M3 12C7 5 17 5 21 12C17 19 7 19 3 12Z"/><circle cx="12" cy="12" r="2.7"/></g><path class="eye-closed" d="M3 10C7 18 17 18 21 10M6 14l-2 3M12 16v3M18 14l2 3"/></svg></button></div><button class="primary" type="submit">인증하고 계속</button><p class="note">인증은 15분 동안 유지됩니다.</p></form>
<section id="controls" hidden>
<div class="card"><div id="state">보호 상태 확인 중</div><div id="countdown">--:--:--</div><div id="deadline" class="note"></div></div>
<form id="allow" class="card"><h2>모든 사이트 일시 허용</h2><label for="minutes">허용 시간 (분)</label><input id="minutes" type="number" inputmode="numeric" min="1" max="1440" step="1" value="30" required><div class="quick"><button type="button" class="secondary" data-minutes="15">15분</button><button type="button" class="secondary" data-minutes="30">30분</button><button type="button" class="secondary" data-minutes="60">1시간</button><button type="button" class="secondary" data-minutes="120">2시간</button></div><button type="submit" class="primary">지금부터 허용</button><button type="button" id="stop" class="stop">허용 종료 · 보호 복원</button><p class="note">설정하면 지금부터 새로 계산합니다. 최대 24시간이며, 종료 시 Safe Child의 기존 도메인·포트 규칙을 다시 적용합니다. 다른 보안 프로그램의 차단은 변경하지 않습니다.</p></form>
<div class="footer"><span>PC 앱이 켜져 있어야 제어할 수 있습니다.</span><button id="logout">로그아웃</button></div></section>
</main><script nonce="__NONCE__">
const base=location.pathname.replace(/\/$/,''),login=document.querySelector('#login'),controls=document.querySelector('#controls'),message=document.querySelector('#message');
let remaining=0,received=Date.now(),authorized=false,polling=false;
function notice(text){message.textContent=text}
function setPasswordVisible(visible){document.querySelector('#password').type=visible?'text':'password';const button=document.querySelector('#password-eye');button.setAttribute('aria-pressed',String(visible));button.setAttribute('aria-label',visible?'비밀번호 숨기기':'비밀번호 표시')}
document.querySelector('#password-eye').addEventListener('click',()=>{setPasswordVisible(document.querySelector('#password').type==='password');document.querySelector('#password').focus()});
function signedIn(value){authorized=value;login.hidden=value;controls.hidden=!value;setPasswordVisible(false)}
async function api(path,data){
 const response=await fetch(base+'/api/'+path,{method:data===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:data===undefined?{}:{'Content-Type':'application/json','X-SafeChild':'1'},body:data===undefined?undefined:JSON.stringify(data)});
 if(response.status===401){signedIn(false);throw Error('비밀번호를 확인하거나 다시 인증해 주세요.')}
 if(response.status===429)throw Error('인증 요청이 많습니다. 1분 후 다시 시도하세요.');
 if(!response.ok){let detail;try{detail=await response.json()}catch{}throw Error(detail?.error||'PC에 적용하지 못했습니다. 연결과 PC 상태를 확인하세요.')}
 return response.status===204?null:response.json();
}
function render(status){
 remaining=status.remainingSeconds;received=Date.now();
 document.querySelector('#state').textContent=status.allowAll?'모든 사이트 허용 중':'기존 보호 규칙 적용 중';
 document.querySelector('#deadline').textContent=status.allowAll&&status.until?'종료 예정 · '+new Date(status.until).toLocaleString('ko-KR'):'허용 시간을 설정하면 PC의 차단을 잠시 해제합니다.';
 document.querySelector('#stop').disabled=!status.allowAll;
 if(status.error)notice(status.error);tick();
}
function tick(){const seconds=Math.max(0,remaining-Math.floor((Date.now()-received)/1000));document.querySelector('#countdown').textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(v=>String(v).padStart(2,'0')).join(':')}
async function action(form,run){const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);notice('');try{await run()}catch(e){notice(e.message||'PC와 연결할 수 없습니다. 같은 Wi-Fi인지 확인하세요.')}finally{buttons.forEach(b=>b.disabled=false);document.querySelector('#stop').disabled=remaining<=0}}
login.addEventListener('submit',e=>{e.preventDefault();action(login,async()=>{const password=document.querySelector('#password');const status=await api('login',{password:password.value});password.value='';signedIn(true);render(status)})});
document.querySelectorAll('[data-minutes]').forEach(b=>b.addEventListener('click',()=>document.querySelector('#minutes').value=b.dataset.minutes));
document.querySelector('#allow').addEventListener('submit',e=>{e.preventDefault();action(e.currentTarget,async()=>{const minutes=Number(document.querySelector('#minutes').value);if(!Number.isInteger(minutes)||minutes<1||minutes>1440)throw Error('1~1440분 사이의 정수를 입력하세요.');render(await api('allow',{minutes}));notice('허용 시간을 적용했습니다.')})});
document.querySelector('#stop').addEventListener('click',()=>action(document.querySelector('#allow'),async()=>{render(await api('allow',{minutes:0}));notice('허용을 종료하고 기존 보호 규칙을 적용했습니다.')}));
document.querySelector('#logout').addEventListener('click',async()=>{try{await api('logout',{});signedIn(false);notice('로그아웃했습니다. 설정한 허용 시간은 유지됩니다.')}catch(e){notice(e.message)}});
async function refresh(){if(polling)return;polling=true;try{const status=await api('status');signedIn(true);render(status)}catch(e){if(authorized)notice('PC 연결을 확인하세요. 표시된 남은 시간은 마지막 확인 기준입니다.')}finally{polling=false}}
setInterval(tick,1000);setInterval(()=>{if(authorized)refresh()},5000);refresh();
</script></body></html>
