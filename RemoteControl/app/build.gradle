plugins { id 'com.android.application' }
android {
    namespace 'com.remotecontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.remotecontrol'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    flavorDimensions 'role'
    productFlavors {
        host { dimension 'role'; applicationIdSuffix '.host'; resValue 'string', 'app_name', 'RemoteControl Host' }
        target { dimension 'role'; applicationIdSuffix '.target'; resValue 'string', 'app_name', 'RemoteControl Target' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
