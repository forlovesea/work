<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 828" role="img" aria-label="안전한 업데이트와 수동 롤백"><title>안전한 업데이트와 수동 롤백</title><desc>기록 대기 0건 · 회의 종료 DB와 설정 백업 → 이전 current 경로 기록 git pull 후 installer 실행 → 새 환경 · 모델 준비 성공? → Moa 정지 → current 전환 Moa 시작 → 상태 및 외부 기능 정상? → 기존 서비스 영향 확인 배포 커밋과 결과 기록</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">안전한 업데이트와 수동 롤백</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="93">기록 대기 0건 · 회의 종료</tspan><tspan x="260" y="119">DB와 설정 백업</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="194.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="225">이전 current 경로 기록</tspan><tspan x="260" y="251">git pull 후 installer 실행</tspan></text><path d="M260,270 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,320.0 L410.0,364 L260,408.0 L110.0,364 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="370">새 환경 · 모델 준비 성공?</tspan></text><path d="M260,408 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="440" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,364 L550,364" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="352" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="326.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="357">오류 원인 확인</tspan><tspan x="720" y="383">활성 전환 여부 점검</tspan></text><rect x="110.0" y="458.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="489">Moa 정지 → current 전환</tspan><tspan x="260" y="515">Moa 시작</tspan></text><path d="M260,534 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,584.0 L410.0,628 L260,672.0 L110.0,628 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="634">상태 및 외부 기능 정상?</tspan></text><path d="M260,672 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="704" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><path d="M410,628 L550,628" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="616" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><rect x="550.0" y="590.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="621">Moa 정지 → 이전 링크 복원</tspan><tspan x="720" y="647">시작 후 재검증</tspan></text><rect x="110.0" y="722.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">기존 서비스 영향 확인</tspan><tspan x="260" y="779">배포 커밋과 결과 기록</tspan></text></g></svg>