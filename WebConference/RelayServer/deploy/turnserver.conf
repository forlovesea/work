# Replace realm, public IP and password before enabling --profile turn.
listening-port=3478
fingerprint
lt-cred-mech
realm=meet.example.com
user=meeting:REPLACE_WITH_LONG_RANDOM_PASSWORD
# If NAT is present: external-ip=PUBLIC_IP/PRIVATE_IP
# external-ip=203.0.113.10
min-port=49160
max-port=49260
no-cli
no-tls
no-dtls
no-multicast-peers
no-loopback-peers
denied-peer-ip=169.254.0.0-169.254.255.255
user-quota=24
total-quota=240
log-file=stdout
