<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-label="회의 생성과 승인 분기"><title>회의 생성과 승인 분기</title><desc>새 회의 만들기 선택 → Master 세션 유효? → 이름과 연락처 입력 이메일 인증 요청 → Master가 승인? → 이름 · 연락처 · 기한 확인 승인 1회 소비 → 방 수 · 입력 · 기록 설정 검증 방과 방장 생성 → 새 회의 시작 초대 링크 전달</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#526b88"/></marker></defs><rect width="100%" height="100%" rx="16" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" fill="#172c44" font-size="21"><tspan x="480" y="34">회의 생성과 승인 분기</tspan></text><rect x="110.0" y="62.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="106">새 회의 만들기 선택</tspan></text><path d="M260,138 L260,194" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,188.0 L410.0,232 L260,276.0 L110.0,232 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="238">Master 세션 유효?</tspan></text><path d="M260,276 L260,326" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="308" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">아니요</text><path d="M410,232 L550,232" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="220" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">예</text><rect x="550.0" y="194.0" width="340" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="225">이메일 승인 생략</tspan><tspan x="720" y="251">아래 생성 검증으로 진행</tspan></text><rect x="110.0" y="326.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="357">이름과 연락처 입력</tspan><tspan x="260" y="383">이메일 인증 요청</tspan></text><path d="M260,402 L260,458" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,452.0 L410.0,496 L260,540.0 L110.0,496 Z" fill="#fff5d8" stroke="#c99d30"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="502">Master가 승인?</tspan></text><path d="M260,540 L260,590" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="278" y="572" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">승인</text><path d="M410,496 L550,496" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="484" font-size="16" fill="#365473" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">거절 / 만료</text><rect x="550.0" y="458.0" width="340" height="76" rx="12" fill="#fff0ee" stroke="#cd948b"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="720" y="489">새 요청 또는 사용자 확인</tspan><tspan x="720" y="515">생성 불가</tspan></text><rect x="110.0" y="590.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="621">이름 · 연락처 · 기한 확인</tspan><tspan x="260" y="647">승인 1회 소비</tspan></text><path d="M260,666 L260,722" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="722.0" width="300" height="76" rx="12" fill="#f1f5fb" stroke="#a6b8d0"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="753">방 수 · 입력 · 기록 설정 검증</tspan><tspan x="260" y="779">방과 방장 생성</tspan></text><path d="M260,798 L260,854" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/><rect x="110.0" y="854.0" width="300" height="76" rx="38.0" fill="#e8f6ef" stroke="#6ca58c"/><text text-anchor="middle" fill="#172c44" font-size="18"><tspan x="260" y="885">새 회의 시작</tspan><tspan x="260" y="911">초대 링크 전달</tspan></text><path d="M890,232 L922,232 L922,760 L410,760" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/></g></svg>